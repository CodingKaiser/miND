[workspace]
name = "mind"
version = "1.4.0"
description = "miND - miRNA NGS Discovery pipeline (workspace environment)"
channels = ["bioconda", "conda-forge"]
platforms = ["linux-64"]
channel-priority = "disabled"

[dependencies]
python = "3.9.*"
pandas = "1.1.*"
xlrd = "1.*"
snakemake = "7.*"
mamba = "*"
graphviz = "2.42.*"
aria2 = "*"

[tasks]
exec_workflow = "bash run.sh"
[tasks.build-repository]
cmd = "bash build.sh"
cwd = "repository"
